<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitnessMy — макет нового меню</title>
<style>
  @font-face { font-family: Manrope; src:url("../../public/fonts/manrope-400-cyrillic-1.woff2"); font-display:swap; font-weight:400; unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116 }
  @font-face { font-family: Manrope; src:url("../../public/fonts/manrope-700-cyrillic-9.woff2"); font-display:swap; font-weight:700; unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116 }
  @font-face { font-family: Manrope; src:url("../../public/fonts/manrope-400-latin-3.woff2"); font-display:swap; font-weight:400; unicode-range:U+0000-00FF,U+2000-206F }
  @font-face { font-family: Manrope; src:url("../../public/fonts/manrope-700-latin-11.woff2"); font-display:swap; font-weight:700; unicode-range:U+0000-00FF,U+2000-206F }
  @font-face { font-family:Unbounded; src:url("../../public/fonts/unbounded-700-cyrillic.woff2") format("woff2"); font-display:swap; font-weight:700; unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116 }
  @font-face { font-family:Unbounded; src:url("../../public/fonts/unbounded-700-latin.woff2") format("woff2"); font-display:swap; font-weight:700; unicode-range:U+0000-00FF,U+2000-206F,U+2113,U+2191,U+2193,U+2212 }
  @font-face { font-family:"IBM Plex Mono"; src:url("../../public/fonts/plex-mono-500-cyrillic-5.woff2"); font-display:swap; font-weight:500; unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116 }
  @font-face { font-family:"IBM Plex Mono"; src:url("../../public/fonts/plex-mono-500-latin-7.woff2"); font-display:swap; font-weight:500; unicode-range:U+0000-00FF,U+2000-206F }
  :root { color-scheme: dark; --bg:#090d17; --panel:#142431; --panel-deep:#10121f; --inner:#101b26; --ink:#f0f5f9; --muted:#b8c6d1; --line:#4b6574; --accent:#fff268; --accent-end:#ffb43e; --signal:#62e2ec; --signal-deep:#2e8aa8; --ambient:rgba(27,117,144,.38); --ambient-second:rgba(101,61,169,.31); --clip:20px; --speed:180ms; --display:Unbounded,Manrope,system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; font-family:Manrope,system-ui,sans-serif }
  :root[data-style="b"] { --bg:#110c19; --panel:#32192f; --panel-deep:#13172c; --inner:#211529; --muted:#e2c9de; --line:#79506c; --accent:#ff80be; --accent-end:#ffb083; --signal:#75f4e4; --signal-deep:#4b85bd; --ambient:rgba(180,47,118,.32); --ambient-second:rgba(29,81,167,.35); --clip:24px }
  * { box-sizing:border-box }
  body { margin:0; color:var(--ink); background:radial-gradient(ellipse at 22% 4%,var(--ambient),transparent 54%),radial-gradient(ellipse at 92% 35%,var(--ambient-second),transparent 54%),var(--bg); min-width:0; min-height:100vh }
  button { cursor:pointer; color:var(--ink); border:1px solid var(--line); background:linear-gradient(130deg,var(--panel),var(--inner) 70%); border-radius:3px; font:inherit; font-weight:700; min-height:44px; padding:8px 13px; transition:transform 100ms,border-color var(--speed),box-shadow var(--speed) }
  button:hover { border-color:var(--signal); box-shadow:0 0 14px color-mix(in srgb,var(--signal) 24%,transparent) }
  button:active { transform:translateY(2px) scale(.98) }
  button:focus-visible, dialog:focus-visible { outline:2px solid var(--signal); outline-offset:3px }
  button[aria-pressed="true"], .primary { border-color:var(--accent); background:linear-gradient(112deg,var(--accent),var(--accent-end)); color:#141018 }
  .preview-bar { border-bottom:1px solid var(--line); background:linear-gradient(110deg,var(--inner),var(--bg)) }
  .preview-bar > div { max-width:1320px; margin:auto; padding:10px 24px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center }
  .style-picker { display:flex; gap:6px; flex-wrap:wrap }
  .preview-caption { color:var(--muted); font-size:.84rem }
  .shell { max-width:1320px; margin:auto; padding:28px 24px 52px; display:grid; grid-template-columns:160px minmax(0,1fr); gap:28px }
  .rail { border-right:1px solid var(--line); padding-right:18px }
  .brand { color:var(--accent); font-family:var(--display); font-weight:700; letter-spacing:-.035em; font-size:1.15rem }
  .nav { display:grid; gap:9px; margin-top:30px; color:var(--muted); font-weight:700 }
  .nav span { padding:9px 10px }
  .nav .current { color:var(--accent); background:linear-gradient(90deg,var(--panel),transparent); border-left:3px solid var(--accent) }
  main { min-width:0 }
  h1,h2,h3,p { margin:0 }
  h1,h2 { font-family:var(--display); font-weight:700 }
  h1 { font-size:clamp(1.48rem,4.25vw,3.25rem); letter-spacing:-.055em; line-height:1.12 }
  h1 { color:var(--accent); background:linear-gradient(108deg,var(--accent) 12%,#fff8da 58%,var(--signal)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent }
  h2 { font-size:1.01rem; letter-spacing:-.035em }
  .hero { display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:17px }
  .hero p { margin-top:9px; color:var(--muted); font-size:.94rem }
  .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border:1px solid var(--line); background:linear-gradient(102deg,var(--panel),var(--panel-deep)); margin-bottom:20px; position:relative }
  .metrics::before { content:""; position:absolute; inset:0 0 auto 0; height:2px; background:linear-gradient(90deg,var(--signal),var(--signal-deep) 43%,transparent 83%) }
  .metric { padding:14px 16px; border-right:1px solid var(--line) }
  .metric:last-child { border:0 }
  .metric span { display:block; color:var(--muted); font-size:.8rem; line-height:1.15 }
  .metric strong,.total,.portion,.meal small { font-variant-numeric:tabular-nums; font-family:var(--mono); font-weight:500 }
  .metric strong { display:block; margin-top:6px; font-size:clamp(1.16rem,3vw,1.8rem) }
  .compare { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:13px }
  .card { --frame-start:var(--signal-deep); --frame-end:var(--line); background:linear-gradient(145deg,var(--frame-start),var(--frame-end) 54%,var(--signal-deep)); position:relative; padding:1px; min-width:0; clip-path:polygon(0 0, calc(100% - var(--clip)) 0,100% var(--clip),100% 100%,0 100%); animation:arrive var(--speed) ease-out both }
  .card[data-selected="true"] { --frame-start:var(--accent); --frame-end:var(--accent-end); padding:2px }
  .card > div { background:linear-gradient(145deg,var(--panel),var(--panel-deep) 67%); min-height:100%; padding:16px; display:flex; flex-direction:column; gap:13px; clip-path:inherit }
  .card header { border-bottom:1px solid var(--line); padding-bottom:12px; position:relative }
  .card header::before { content:""; position:absolute; top:-16px; left:-16px; width:70px; height:2px; background:linear-gradient(90deg,var(--signal),transparent) }
  .card[data-selected="true"] header::before { background:linear-gradient(90deg,var(--accent),transparent) }
  .total { color:var(--signal); font-size:1.02rem; margin-top:7px }
  .macro { color:var(--muted); font-size:.8rem; margin-top:4px }
  .meals { display:grid; gap:7px; flex:1 }
  .meal { background:linear-gradient(102deg,var(--inner),var(--panel-deep)); padding:10px; border-left:2px solid var(--signal-deep); min-height:102px; display:grid; align-content:start; gap:5px; overflow-wrap:anywhere }
  [data-style="b"] .meal { border-left-color:var(--signal) }
  .meal small { color:var(--muted); font-size:.72rem; font-weight:700; letter-spacing:.045em; text-transform:uppercase }
  .meal strong { font-size:.94rem; line-height:1.28 }
  .meal .portion { font-size:.78rem; color:var(--muted) }
  .actions { display:grid; gap:7px }
  .tabs { display:none }
  #message { margin:14px 0 0; min-height:1.5em; color:var(--signal) }
  dialog { max-width:min(420px,calc(100% - 30px)); border:1px solid var(--signal); background:linear-gradient(135deg,var(--panel),var(--panel-deep)); color:var(--ink); padding:22px; animation:arrive var(--speed) ease-out both }
  dialog::backdrop { background:#05070bd9 }
  dialog p { margin:10px 0 16px; line-height:1.5 }
  @keyframes arrive { from { opacity:.35; transform:translateY(6px) } to { opacity:1; transform:translateY(0) } }
  @media (max-width:930px) {
    .shell { grid-template-columns:1fr }
    .rail { border:0; padding:0; display:flex; align-items:center; justify-content:space-between; gap:12px }
    .nav { display:flex; margin:0; gap:0; flex-wrap:wrap }
  }
  @media (max-width:700px) {
    .shell { padding:17px 15px 30px; gap:14px }
    .preview-bar > div { padding:8px 15px; gap:4px }
    .nav span { display:none }
    .nav .current { display:block }
    .hero { align-items:flex-start }
    .hero p { font-size:.85rem }
    .metric { padding:11px 7px }
    .metric span { font-size:.67rem }
    .tabs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-bottom:10px }
    .tabs button { padding-inline:4px }
    .compare { display:block }
    .card:not([data-active="true"]) { display:none }
    .meal { min-height:0 }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation:none!important; transition:none!important; transform:none!important }
  }
  @media (forced-colors:active) {
    h1 { -webkit-text-fill-color:CanvasText }
  }
</style>
<header class="preview-bar">
  <div>
    <p class="preview-caption">Макет FitnessMy · демонстрационные данные</p>
    <div class="style-picker" role="group" aria-label="Стиль макета">
      <button id="a" aria-pressed="true">A · Жёлтый HUD</button>
      <button id="b" aria-pressed="false">B · Малиновый HUD</button>
    </div>
  </div>
</header>
<div class="shell">
  <aside class="rail">
    <p class="brand">FitnessMy</p>
    <div class="nav"><span>Сегодня</span><span class="current" aria-current="page">Еда</span><span>Зал</span><span>Тело</span><span>Прогресс</span></div>
  </aside>
  <main>
    <header class="hero">
      <div><h1>Меню на день</h1><p id="subtitle">Три варианта на завтрак, обед и ужин</p></div>
      <button id="simulate" aria-pressed="false">Показать после завтрака</button>
    </header>
    <section class="metrics" id="metrics" aria-label="Остаток на день"></section>
    <div class="tabs" id="tabs" role="group" aria-label="Вариант меню"></div>
    <section class="compare" id="compare" aria-label="Сравнение меню"></section>
    <p id="message" role="status"></p>
  </main>
</div>
<dialog id="preview" aria-labelledby="preview-title">
  <h2 id="preview-title">Порция</h2>
  <p id="preview-text"></p>
  <form method="dialog"><button class="primary">Закрыть</button></form>
</dialog>
<script>
  const menus = [
    [["Завтрак","Овсянка с ягодами и йогуртом",320,520],["Обед","Индейка с гречкой и овощами",460,790],["Ужин","Лосось с картофелем и салатом",390,720]],
    [["Завтрак","Омлет со шпинатом и тостом",290,510],["Обед","Говядина с рисом и перцем",440,810],["Ужин","Треска с булгуром и овощами",420,710]],
    [["Завтрак","Творог с грушей и орехами",310,545],["Обед","Чечевица с тыквой и фетой",430,755],["Ужин","Курица с киноа и брокколи",440,730]]
  ];
  const totals = [[138,68,216],[143,69,208],[134,71,214]];
  const macroAfterBreakfast = [[101,50,161],[105,49,156],[100,48,158]];
  const byId = (id) => document.getElementById(id);
  const tabs = byId("tabs"), compare = byId("compare"), metrics = byId("metrics");
  const preview = byId("preview"), message = byId("message");
  let selected = -1, active = 0, breakfastLogged = false;
  function mealsFor(menu) {
    return breakfastLogged ? menu.slice(1).map(([slot,dish,grams,kcal]) =>
      [slot,dish,Math.round(grams * .92),Math.round(kcal * .92)]) : menu;
  }

  function render() {
    const remaining = breakfastLogged ? [1550,105,50,165] : [2100,140,70,225];
    metrics.innerHTML = remaining.map((value, i) =>
      '<div class="metric"><span>' + ["Осталось, ккал","Белки, г","Жиры, г","Углеводы, г"][i] +
      '</span><strong>' + value.toLocaleString("ru-RU") + '</strong></div>').join("");
    tabs.innerHTML = menus.map((_, i) => '<button data-tab="' + i + '" aria-pressed="' +
      (active === i) + '">Меню ' + (i + 1) + '</button>').join("");
    compare.innerHTML = menus.map((menu, i) => {
      const meals = mealsFor(menu);
      const kcal = meals.reduce((sum, meal) => sum + meal[3], 0);
      const [p,f,c] = (breakfastLogged ? macroAfterBreakfast : totals)[i];
      return '<article class="card" data-active="' + (i === active) + '" data-selected="' + (i === selected) +
        '"><div><header><h2>Меню ' + (i + 1) + '</h2><p class="total">' + kcal.toLocaleString("ru-RU") +
        ' ккал</p><p class="macro">Б ' + p + ' г · Ж ' + f + ' г · У ' + c + ' г</p></header><div class="meals">' +
        meals.map(([slot, dish, grams, energy]) => '<div class="meal"><small>' + slot + '</small><strong>' +
          dish + '</strong><span class="portion">' + grams + ' г · ' + energy + ' ккал</span></div>').join("") +
        '</div><div class="actions"><button data-select="' + i + '" aria-pressed="' + (selected === i) +
        '">' + (selected === i ? "Меню выбрано" : "Выбрать меню") + '</button><button data-preview="' + i +
        '">Посмотреть порцию</button></div></div></article>';
    }).join("");
  }

  for (const style of ["a", "b"]) byId(style).onclick = () => {
    document.documentElement.dataset.style = style;
    for (const id of ["a", "b"]) byId(id).setAttribute("aria-pressed", String(id === style));
  };
  byId("simulate").onclick = (event) => {
    breakfastLogged = !breakfastLogged;
    event.currentTarget.setAttribute("aria-pressed", String(breakfastLogged));
    event.currentTarget.textContent = breakfastLogged ? "Вернуть полный день" : "Показать после завтрака";
    byId("subtitle").textContent = breakfastLogged ? "Завтрак записан · варианты на обед и ужин" : "Три варианта на завтрак, обед и ужин";
    render();
    message.textContent = breakfastLogged ? "Обед и ужин пересчитаны." : "";
  };
  tabs.onclick = (event) => {
    const button = event.target.closest("[data-tab]");
    if (!button) return;
    active = Number(button.dataset.tab);
    render();
    tabs.querySelector('[data-tab="' + active + '"]').focus();
  };
  compare.onclick = (event) => {
    const select = event.target.closest("[data-select]");
    const detail = event.target.closest("[data-preview]");
    if (select) {
      selected = Number(select.dataset.select);
      active = selected;
      render();
      compare.querySelector('[data-select="' + selected + '"]').focus();
      message.textContent = "Выбрано меню " + (selected + 1) + ".";
    }
    if (detail) {
      const [slot,dish,grams,kcal] = mealsFor(menus[Number(detail.dataset.preview)])[0];
      byId("preview-title").textContent = slot;
      byId("preview-text").textContent = dish + " · " + grams + " г · " + kcal + " ккал";
      preview.showModal();
    }
  };
  render();
</script>
</html>
